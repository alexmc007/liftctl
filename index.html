function movesHtml(){
  var s=loadLC(),h='',by=weekOutcomesByMuscle(),v=effectiveVolume(),any=false;
  h+='<div class="lbl">Per-line moves</div>';
  s.program.sessions.forEach(function(sess){
    sessionUnits(sess).forEach(function(u){
      var items=u.kind==='ss'?[u.a,u.b]:[u.cfg];
      items.forEach(function(cfg){
        if(!cfg)return;
        var dirs=u.kind==='ss'&&u.rev?['p','r']:[u.kind==='ss'?'p':'na'];
        var best=null;
        Object.keys(GYMS).forEach(function(g){
          dirs.forEach(function(dir){
            var le=lastEntry(lineKey(g,sess.id,cfg.slug,u.slotIdx,dir));
            if(le&&(!best||le.date>best.date))best=le;
          });
        });
        if(!best||!best.rec)return;
        any=true;
        var icon={addLoad:'⬆️',loadBump:'⬆️',addRep:'＋',hold:'⏸',deload:'⬇️',baseline:'🏳️'}[best.rec.type]||'•';
        h+='<div class="row"><div class="grow"><div class="rn">'+esc(cfg.name)+'</div>'+
          '<div class="rs">'+esc(sess.name)+' · last: '+esc((best.setsLogged||[]).map(function(x){return x.load+'×'+x.reps;}).join(' · '))+'</div></div>'+
          '<div style="font-size:12px;font-weight:700;color:var(--dim);text-align:right">'+icon+' '+esc(shortRec(best.rec,cfg))+'</div></div>';
      });
    });
  });
  if(!any)h+='<div class="card">Log a session first — recommendations build from your outcomes.</div>';
  h+='<div class="lbl">Volume moves</div>';
  var vol=[],lo=s.settings.targetLow,hi=s.settings.targetHigh;
  Object.keys(MUSCLES).forEach(function(m){
    var eff=v.eff[m]||0;if(!eff)return;
    var la=s.volume.lastAdd[m];
    var ev=Engine.evalVolume({effSets:eff,targetLow:lo,targetHigh:hi,outcomes:by[m]||[],
      daysSinceAdd:la?daysAgo(la):null,readiness:readinessNow()});
    if(ev.action!=='hold')vol.push({m:m,ev:ev});
  });
  if(!vol.length)h+='<div class="card">All muscles holding — volume is where it should be.</div>';
  vol.forEach(function(x){
    h+='<div class="row"><div class="grow"><div class="rn">'+esc(MUSCLES[x.m].label)+'</div>'+
      '<div class="rs">'+esc(x.ev.reason)+'</div></div>'+
      '<div style="font-weight:700;font-size:13px;color:'+(x.ev.action==='add'?'var(--warn)':'var(--bad)')+'">'+(x.ev.action==='add'?'＋1 set':'−1 set')+'</div></div>';
  });
  if(vol.length)h+='<button class="btn warn" onclick="applyVolumeMoves()">Apply volume moves to the program</button>';
  h+='<div class="note">Per-line moves apply themselves — the runner prefills next session from each line outcome. Volume moves change set counts in the program, so those need the explicit apply.</div>';
  return h;
}
function shortRec(rec,cfg){
  if(rec.type==='addLoad')return '+'+(rec.inc||cfg.inc)+' load';
  if(rec.type==='loadBump')return 'bump load';
  if(rec.type==='addRep')return '+1 rep';
  if(rec.type==='deload')return 'deload −10%';
  if(rec.type==='baseline')return 'new baseline';
  return 'hold';
}
function applyVolumeMoves(){
  touch('program');
  var s=loadLC(),by=weekOutcomesByMuscle(),v=effectiveVolume(),changed=[];
  var lo=s.settings.targetLow,hi=s.settings.targetHigh;
  Object.keys(MUSCLES).forEach(function(m){
    var eff=v.eff[m]||0;if(!eff)return;
    var la=s.volume.lastAdd[m];
    var ev=Engine.evalVolume({effSets:eff,targetLow:lo,targetHigh:hi,outcomes:by[m]||[],
      daysSinceAdd:la?daysAgo(la):null,readiness:readinessNow()});
    if(ev.action==='hold')return;
    var target=null;
    s.program.sessions.forEach(function(sess){
      (sess.slots||[]).forEach(function(slot){
        var members=slot.ex?[['ex',slot.ex]]:[['a',slot.ss[0]],['b',slot.ss[1]]];
        members.forEach(function(mm){
          var cfg=cfgFor(mm[1],slot,mm[0]==='ex'?null:mm[0]);
          if(!cfg||cfg.mus!==m)return;
          if(!target||(ev.action==='add'?cfg.sets<target.cfg.sets:cfg.sets>target.cfg.sets))
            target={slot:slot,pos:mm[0],cfg:cfg,sess:sess};
        });
      });
    });
    if(!target)return;
    var d=ev.action==='add'?1:-1;
    var newSets=Math.max(1,target.cfg.sets+d);
    if(target.pos==='ex')target.slot.sets=newSets;
    else if(target.pos==='a')target.slot.setsA=newSets;
    else target.slot.setsB=newSets;
    if(ev.action==='add')s.volume.lastAdd[m]=todayStr();
    changed.push(MUSCLES[m].label+' '+(d>0?'+1':'−1')+' set on '+target.cfg.name);
  });
  saveLC();haptic('success');
  toast(changed.length?('Applied: '+changed.join(' · ')):'Nothing to apply');
  renderPlan('moves');
}
function programHtml(){
  var s=loadLC(),h='';

    var g=GYMS[sess.gym]||{icon:'',name:sess.gym};
    var nsets=0;sessionUnits(sess).forEach(function(u){(u.kind==='ss'?[u.a,u.b]:[u.cfg]).forEach(function(c){if(c)nsets+=c.sets;});});
    h+='<div class="row" onclick="editSession(\''+sess.id+'\')"><div class="grow"><div class="rn">'+esc(sess.name)+'</div>'+

  });
  h+='<div class="note">Rotation: '+esc(s.program.rotation.map(function(id){var x=sessionById(id);return x?x.name.split(' — ')[0]:id;}).join(' → '))+' → repeat. Finish one and it is marked done for '+REST_DAYS+' days.</div>';

}

function edLine(u,cfg,pos){
  if(!cfg)return '';

  if(cfg.fail)pills+=' <span class="pill fail">last set to failure</span>';
  if(cfg.neverFail)pills+=' <span class="pill acc">never to failure</span>';
  return '<div style="font-size:15px;font-weight:700">'+esc(cfg.name)+pills+'</div>'+
    '<div class="field"><label>Sets</label><input type="number" min="1" max="6" value="'+cfg.sets+'" onchange="edSets('+JSON.stringify(u.slotIdx)+',\''+pos+'\',this.value)"></div>'+
    '<div class="field"><label>Rep range</label><div style="display:flex;gap:6px">'+
      '<input type="number" style="width:60px" value="'+cfg.lo+'" onchange="edEx(\''+cfg.slug+'\',\'lo\',this.value)">'+
      '<input type="number" style="width:60px" value="'+cfg.hi+'" onchange="edEx(\''+cfg.slug+'\',\'hi\',this.value)"></div></div>';

function edSets(slotIdx,pos,val){
  var sess=sessionById(ED_SESS);if(!sess)return;
  var slot=sess.slots[+slotIdx];if(!slot)return;
  var v=Math.max(1,Math.min(6,parseInt(val,10)||1));
  touch('program');
  if(pos==='ex')slot.sets=v;else if(pos==='a')slot.setsA=v;else slot.setsB=v;
  saveLC();toast('Saved — '+v+' sets');
}
function edEx(slug,field,val){
  var d=EXDEFS[slug];if(!d)return;
  var v=parseInt(val,10)||d[field];
  d[field]=v;
  var s=loadLC();touch('settings');touch('program');
  s.settings.exOverrides=s.settings.exOverrides||{};
  s.settings.exOverrides[slug]=s.settings.exOverrides[slug]||{};
  s.settings.exOverrides[slug][field]=v;
  saveLC();toast('Saved');
}
function applyExOverrides(){
  var ov=(loadLC().settings||{}).exOverrides||{};
  Object.keys(ov).forEach(function(slug){
    if(!EXDEFS[slug])return;
    Object.keys(ov[slug]).forEach(function(f){EXDEFS[slug][f]=ov[slug][f];});
  });
}

function cardioState(){return loadLC().cardio;}
function paceTxt(s){var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x;}
function targetText(m,p,phase){
  if(m==='treadmill'){
    if(phase==='work')return '<div class="tg-lbl">Set treadmill</div><div class="tg-val">'+p.speed+' mph · '+p.incline+'%</div>';
    return '<div class="tg-lbl">Recovery walk</div><div class="tg-val">'+p.easySpeed+' mph · '+p.incline+'%</div>';
  }
  if(m==='bike'){
    if(phase==='work')return '<div class="tg-lbl">Hold RPM</div><div class="tg-val">~'+p.rpm+' RPM</div>';

  }
  if(phase==='work')return '<div class="tg-lbl">Hold pace</div><div class="tg-val">'+paceTxt(p.paceSec)+' /500m</div>';

function shortTxt(m,p,phase){

  if(m==='bike')return phase==='work'?('~'+p.rpm+' RPM'):('~'+p.easyRpm+' RPM');
  return phase==='work'?(paceTxt(p.paceSec)+'/500m'):(paceTxt(p.easyPaceSec)+'/500m');

  if(phase==='prep')return '<span class="nx-lbl">Up next</span> Work · <b>'+shortTxt(m,p,'work')+'</b> for '+p.workSec+'s';

function cardioSummary(m,p){

function beep(kind){

    o.frequency.value=kind==='done'?880:(kind==='work'?700:380);o.type='sine';o.connect(g);g.connect(hiit.ac.destination);
    g.gain.value=0.0001;
    g.gain.exponentialRampToValueAtTime(0.25,hiit.ac.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,hiit.ac.currentTime+0.32);

    hiit.round++;hiit.phase='work';hiit.rem=p.workSec;beep('work');return;

/* ===== SYNC — Apps Script endpoint over plain HTTP.
   The endpoint URL lives in its own localStorage key, NOT in lc_state,
   so an export stays portable and never carries the endpoint with it.
   Posts go out as text/plain so the browser sends no CORS preflight. ===== */
var SYNC={url:'',rev:0,device:'',lastAt:0,lastErr:'',busy:false,dirty:false};
var _syncT=null;
function loadSync(){
  try{
    var s=JSON.parse(localStorage.getItem('lc_sync')||'null');
    if(s){SYNC.url=s.url||'';SYNC.rev=s.rev||0;SYNC.device=s.device||'';SYNC.lastAt=s.lastAt||0;}
  }catch(e){}
  if(!SYNC.device){
    SYNC.device=(/iPhone|iPad|iPod/.test(navigator.userAgent)?'iPhone':(/Android/.test(navigator.userAgent)?'Android':'Desktop'))+'-'+Math.random().toString(36).slice(2,6);
    saveSyncCfg();
  }
  return SYNC;
}
function saveSyncCfg(){
  try{localStorage.setItem('lc_sync',JSON.stringify({url:SYNC.url,rev:SYNC.rev,device:SYNC.device,lastAt:SYNC.lastAt}));}catch(e){}
}
function syncOn(){return !!SYNC.url;}
function syncDot(){
  var el=$('syncDot');if(!el)return;
  if(!syncOn()){el.className='dot off';el.title='Sync off';return;}
  if(SYNC.busy){el.className='dot busy';el.title='Syncing…';return;}
  if(SYNC.lastErr){el.className='dot err';el.title=SYNC.lastErr;return;}
  el.className='dot ok'+(SYNC.dirty?' pend':'');
  el.title=SYNC.dirty?'Waiting to sync':('Synced '+(SYNC.lastAt?new Date(SYNC.lastAt).toLocaleTimeString():''));
}
function syncPost(body){
  return fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body),redirect:'follow'}).then(function(r){return r.json();});
}
function syncGet(){
  return fetch(SYNC.url+(SYNC.url.indexOf('?')<0?'?':'&')+'action=get&t='+Date.now(),{redirect:'follow'})
    .then(function(r){return r.json();});
}

/* ---- merge: append-only data is unioned, scalars follow the newer _upd,
        so a stale tab can never delete what the other device logged ---- */
function _byDate(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);}
function _lastDate(h){return (h&&h.length)?h[h.length-1].date:'';}
function _union(a,b,keyf,cap,sortIt){
  var seen={},out=[];
  (a||[]).concat(b||[]).forEach(function(x){
    if(!x)return;
    var k=keyf(x);
    if(seen[k])return;
    seen[k]=1;out.push(x);
  });
  if(sortIt!==false)out.sort(_byDate);
  return cap?out.slice(-cap):out;
}
function mergeStates(local,remote){
  if(!remote||typeof remote!=='object')return local;
  if(!local||typeof local!=='object')return remote;
  var lu=+local._upd||0,ru=+remote._upd||0;
  var newer=lu>=ru?local:remote, older=lu>=ru?remote:local;
  var out=JSON.parse(JSON.stringify(newer));

  /* Sections you edit deliberately are settled by their OWN timestamp, so
     logging on one device never rolls back an edit made on the other. */
  var lt=local._t||{},rt=remote._t||{};
  out._t={};
  ['goals','settings','program','schedule'].forEach(function(sec){
    var a=+lt[sec]||lu,b=+rt[sec]||ru;
    out._t[sec]=Math.max(a,b);
    var win=b>a?remote:local;
    if(sec==='schedule'){
      /* only the typed-today scalars — the logs below merge on their own terms */
      var w=win.schedule||{};
      out.schedule=out.schedule||{};
      out.schedule.readiness=w.readiness;out.schedule.readinessDate=w.readinessDate;
      out.schedule.sleepHours=w.sleepHours;out.schedule.sleepDate=w.sleepDate;
    }else if(win[sec]){
      out[sec]=JSON.parse(JSON.stringify(win[sec]));
    }
  });

  /* per-line history + failure benchmarks */
  out.lines=out.lines||{};
  Object.keys(older.lines||{}).forEach(function(k){
    var o=older.lines[k],n=out.lines[k];
    if(!n){out.lines[k]=o;return;}
    n.history=_union(n.history,o.history,function(e){
      return e.date+'|'+(e.setsLogged||[]).map(function(s){return s.load+'x'+s.reps;}).join(',');
    },30);
    n.benchmark=_union(n.benchmark,o.benchmark,function(e){return e.date+'|'+e.load+'|'+e.amrapReps;},50);
    /* the machine snapshot belongs to whichever side logged this line last */
    if(_lastDate(o.history)>_lastDate(n.history)&&o.machine)n.machine=o.machine;
  });

  var os=older.schedule||{},ns=out.schedule=out.schedule||{};
  ns.completions=_union(ns.completions,os.completions,function(c){return c.date+'|'+c.sessionId;},60);
  ns.muscleLast=ns.muscleLast||{};
  Object.keys(os.muscleLast||{}).forEach(function(m){
    if(!ns.muscleLast[m]||os.muscleLast[m]>ns.muscleLast[m])ns.muscleLast[m]=os.muscleLast[m];
  });
  if(os.lastLiftDate&&(!ns.lastLiftDate||os.lastLiftDate>ns.lastLiftDate)){
    ns.lastLiftDate=os.lastLiftDate;
    ns.lastCompletedSessionId=os.lastCompletedSessionId;   /* rotation follows the most recent session */
  }
  out.quickLogs=_union(out.quickLogs,older.quickLogs,function(q){return q.id;},300);

  out.volume=out.volume||{lastAdd:{}};
  var ov=(older.volume||{}).lastAdd||{};
  out.volume.lastAdd=out.volume.lastAdd||{};
  Object.keys(ov).forEach(function(m){
    if(!out.volume.lastAdd[m]||ov[m]>out.volume.lastAdd[m])out.volume.lastAdd[m]=ov[m];
  });

  var oc=older.cardio||{},nc=out.cardio=out.cardio||{};
  nc.hiit=nc.hiit||{};
  Object.keys(oc.hiit||{}).forEach(function(m){
    var o=oc.hiit[m],n=nc.hiit[m];
    if(!n){nc.hiit[m]=o;return;}
    var oLast=_lastDate(o.history),nLast=_lastDate(n.history);
    n.history=_union(n.history,o.history,function(e){return e.date+'|'+e.feedback+'|'+e.level;},40);
    /* the level is a running number — take it from whichever side trained last */
    if(oLast>nLast){n.level=o.level;n.easyStreak=o.easyStreak;}
  });
  nc.vo2Log=_union(nc.vo2Log,oc.vo2Log,function(x){return x.date;},120);
  nc.hrLog=_union(nc.hrLog,oc.hrLog,function(x){return x.date+'|'+x.machine+'|'+x.avgHR;},60);

  out._upd=Math.max(lu,ru);
  return out;
}

function syncNow(reason){
  if(!syncOn()||SYNC.busy)return Promise.resolve(false);
  SYNC.busy=true;SYNC.lastErr='';syncDot();
  var changed=false;
  return syncGet().then(function(res){
    if(!res||!res.ok)throw new Error((res&&res.error)||'endpoint did not answer');
    var remote=null;
    if(res.state){try{remote=JSON.parse(res.state);}catch(e){remote=null;}}
    var before=JSON.stringify(loadLC());
    if(remote&&remote._v){
      LC=migrate(mergeStates(loadLC(),remote));
      var after=JSON.stringify(LC);
      if(after!==before){
        try{localStorage.setItem('lc_state',after);}catch(e){}
        applyExOverrides();changed=true;
      }
    }
    /* push if we hold anything the sheet does not */
    var mine=JSON.stringify(LC);
    if(mine===res.state&&!SYNC.dirty){SYNC.rev=res.rev;return {ok:true,rev:res.rev,skipped:true};}
    return syncPost({kind:'state',baseRev:res.rev,state:mine,device:SYNC.device});
  }).then(function(p){
    if(p&&p.conflict){
      /* someone wrote between our read and our write — merge theirs in and retry once */
      var theirs=null;try{theirs=JSON.parse(p.state);}catch(e){}
      if(theirs&&theirs._v){LC=migrate(mergeStates(loadLC(),theirs));saveLCRaw();changed=true;}
      return syncPost({kind:'state',baseRev:p.rev,state:JSON.stringify(LC),device:SYNC.device});
    }
    return p;
  }).then(function(p){
    if(!p||(!p.ok&&!p.skipped))throw new Error((p&&p.error)||'save refused');
    SYNC.rev=p.rev||SYNC.rev;SYNC.lastAt=Date.now();SYNC.dirty=false;SYNC.lastErr='';
    saveSyncCfg();SYNC.busy=false;syncDot();
    if(changed&&ROOTS[currentView]&&currentView!=='runner')navTo(currentView);
    if(reason==='manual')toast(changed?'Synced — pulled in changes':'Synced ✓');
    return true;
  }).catch(function(e){
    var msg=String(e.message||e);
    /* A browser reports a blocked cross-origin request as a bare "Failed to
       fetch", which is unactionable. It is nearly always the deployment
       access setting, so say that instead. */
    if(/failed to fetch|networkerror|load failed/i.test(msg)){
      msg=navigator.onLine
        ? 'Could not reach the endpoint. In Apps Script check Deploy → Manage deployments → Who has access = Anyone, and that the URL ends in /exec.'
        : 'Offline — will sync when you are back.';
    }
    SYNC.busy=false;SYNC.lastErr=msg;syncDot();
    if(reason==='manual')toast('Sync failed: '+SYNC.lastErr,true);
    return false;
  });
}
function syncSoon(){
  if(!syncOn())return;
  SYNC.dirty=true;syncDot();
  clearTimeout(_syncT);
  _syncT=setTimeout(function(){syncNow('auto');},2500);
}
function connectSync(){
  var url=($('syncUrl').value||'').trim();
  var ok=/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)||/^https?:\/\/localhost(:\d+)?\/exec$/.test(url); /* localhost = local test harness */
  if(!ok){toast('That should be the Apps Script /exec URL',true);return;}
  SYNC.url=url;SYNC.rev=0;saveSyncCfg();
  toast('Connecting…');
  syncNow('manual').then(function(ok){
    if(!ok){SYNC.url='';saveSyncCfg();}
    renderSettings();
  });
}
function disconnectSync(){
  uiConfirm('Stop syncing this device? Your data stays here and stays in the sheet.','Disconnect').then(function(ok){
    if(!ok)return;
    SYNC.url='';SYNC.rev=0;saveSyncCfg();syncDot();renderSettings();toast('Sync off');
  });
}

/* ===== BOOT ===== */
(function boot(){
  loadLC();
  applyExOverrides();
  /* a run paused more than 16h ago is not resumed mid-set — bank what was logged */
  try{
    var st=JSON.parse(localStorage.getItem('lc_run')||'null');
    if(st&&st.savedTs&&(Date.now()-st.savedTs)>16*3600*1000){
      if(runLoggedCount(st)>0&&hydrateRun(st))finishSession(true);
      else clearRun();
    }
  }catch(e){}
  if(currentView!=='summary'){
    renderToday();
    showView('today',true);
  }
  loadSync();syncDot();
  if(syncOn())syncNow('boot');
})();

/* pull whatever the other device logged whenever this one comes back to the front */
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&syncOn()&&!RUN)syncNow('focus');
});
window.addEventListener('online',function(){if(syncOn())syncNow('online');});
</script>
