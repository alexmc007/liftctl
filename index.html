<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SetClock</title>
<style>
:root{
  --bg:#0b0d10; --card:#14181d; --card2:#1a1f26; --line:#242c35;
  --txt:#e9eef4; --dim:#8b98a6; --dim2:#5f6b78;
  --acc:#4ade80; --blue:#60a5fa; --warn:#fbbf24; --bad:#f87171; --purple:#a78bfa;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--blue)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(11,13,16,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.logo{font-size:19px;font-weight:750;letter-spacing:-.02em}
.logo b{color:var(--acc)}
.gympill{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;font-size:13px;color:var(--dim);max-width:56%}
.gympill span{color:var(--txt);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}
.sp{margin-left:auto}
.muted{color:var(--dim)}
.tiny{font-size:12px}
.sm{font-size:13px}
.mono{font-variant-numeric:tabular-nums}
.sect{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2);font-weight:700;margin:20px 2px 6px}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:#06210f;border-color:transparent}
.btn.blue{background:var(--blue);color:#06182e;border-color:transparent}
.btn.ghost{background:transparent}
.btn.wide{width:100%;padding:14px;font-size:15px}
.btn.sm{padding:7px 11px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--dim)}
.chip.on{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.45);color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.bar{height:7px;border-radius:99px;background:var(--card2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .35s}
.bar .mark{position:absolute;top:-2px;width:2px;height:11px;background:var(--dim);opacity:.75;border-radius:2px}
.dot{width:8px;height:8px;border-radius:99px;flex:none}
.g-acc{color:var(--acc)} .g-warn{color:var(--warn)} .g-bad{color:var(--bad)} .g-blue{color:var(--blue)}
.b-acc,.bar i.b-acc{background:var(--acc)} .b-warn,.bar i.b-warn{background:var(--warn)}
.b-bad,.bar i.b-bad{background:var(--bad)} .b-dim,.bar i.b-dim{background:var(--dim2)} .b-blue,.bar i.b-blue{background:var(--blue)}
.empty{text-align:center;color:var(--dim2);padding:36px 16px;font-size:14px}

/* today priority rows */
.prow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:650;font-size:15px}
.prow .sub{font-size:12.5px;color:var(--dim);margin-top:2px}
.pnum{margin-left:auto;text-align:right;flex:none}
.pnum b{font-size:19px;font-weight:750;line-height:1}
.pnum s{display:block;font-size:10.5px;color:var(--dim2);text-decoration:none;letter-spacing:.05em;text-transform:uppercase;margin-top:3px}
.ring{width:34px;height:34px;flex:none;border-radius:99px;display:grid;place-items:center;font-size:11px;font-weight:700}

/* exercise list */
.ex{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;margin-bottom:7px;width:100%;text-align:left}
.ex:active{background:var(--card2)}
.ex .nm{font-weight:600;font-size:14.5px}
.ex .mt{font-size:11.5px;color:var(--dim);margin-top:2px}
.tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;
  background:var(--card2);color:var(--dim);border:1px solid var(--line)}

/* stepper */
.step{display:flex;align-items:stretch;gap:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step button{width:46px;font-size:20px;font-weight:600;color:var(--dim);background:transparent}
.step button:active{background:rgba(255,255,255,.06)}
.step input{border:0;border-radius:0;text-align:center;font-size:22px;font-weight:700;padding:12px 0;background:transparent}
.fl{flex:1;min-width:0}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim2);font-weight:700;margin-bottom:6px;display:block}

/* set pills */
.setline{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card2);border-radius:10px;margin-bottom:6px;font-size:14px}
.setline .idx{width:22px;height:22px;border-radius:99px;background:var(--card);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--dim)}
.x{margin-left:auto;color:var(--dim2);padding:4px 8px;font-size:15px}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,13,16,.94);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;max-width:720px;margin:0 auto}
.tab{flex:1;padding:9px 0 8px;text-align:center;color:var(--dim2);font-size:10.5px;font-weight:650;letter-spacing:.02em}
.tab.on{color:var(--acc)}
.tab i{display:block;font-size:19px;font-style:normal;margin-bottom:2px;line-height:1.1}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:20px 20px 0 0;
  border-top:1px solid var(--line);transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
  max-height:92vh;overflow-y:auto;padding:0 14px calc(20px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:9px auto 4px}
.sheeth{position:sticky;top:0;background:var(--card);padding:6px 0 12px;z-index:2}

/* stats bars */
.mrow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.mrow .mn{width:82px;flex:none;font-size:12.5px;color:var(--dim)}
.mrow .mb{flex:1}
.mrow .mv{width:56px;text-align:right;font-size:12.5px;flex:none}
.wk{display:flex;gap:3px;align-items:flex-end;height:46px}
.wk i{flex:1;background:var(--card2);border-radius:3px 3px 0 0;min-height:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:88px;z-index:60;background:var(--acc);color:#06210f;
  font-weight:700;font-size:13.5px;padding:10px 18px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.timer{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;background:var(--card2);
  border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-weight:750;font-variant-numeric:tabular-nums;
  display:none;align-items:center;gap:8px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.timer.on{display:flex}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <div class="logo">Set<b>Clock</b></div>
    <button class="gympill" data-act="pickgym">📍 <span id="gymName">Gym</span></button>
  </div>
</header>

<main class="wrap" id="view"></main>

<div class="timer" id="timer"><span id="timerT">0:00</span><button data-act="stoptimer" style="color:var(--dim);font-size:16px">✕</button></div>
<div class="toast" id="toast"></div>

<nav><div class="tabs" id="tabs">
  <button class="tab on" data-tab="today"><i>◎</i>Today</button>
  <button class="tab" data-tab="log"><i>✚</i>Log</button>
  <button class="tab" data-tab="hist"><i>▤</i>History</button>
  <button class="tab" data-tab="plan"><i>◈</i>Plan</button>
  <button class="tab" data-tab="stats"><i>▦</i>Stats</button>
</div></nav>

<div class="scrim" id="scrim" data-act="closesheet"></div>
<div class="sheet" id="sheet"></div>

<script>
/* ============================================================
   SetClock — weekly set-volume bank with a recovery clock
   One file, localStorage only. No network, no build step.
   ============================================================ */

/* ---------- muscle model ----------
   rec = hours to full recovery for a ~6 effective-set session.
   Scales with how much volume that session actually put on it. */
const MUSCLES = [
  {k:'chest',    n:'Chest',      rec:56, cap:10},
  {k:'back',     n:'Back',       rec:60, cap:12},
  {k:'delts',    n:'Shoulders',  rec:40, cap:9},
  {k:'reardelts',n:'Rear Delts', rec:32, cap:8},
  {k:'biceps',   n:'Biceps',     rec:40, cap:8},
  {k:'triceps',  n:'Triceps',    rec:44, cap:8},
  {k:'quads',    n:'Quads',      rec:66, cap:9},
  {k:'hams',     n:'Hamstrings', rec:60, cap:8},
  {k:'glutes',   n:'Glutes',     rec:56, cap:9},
  {k:'calves',   n:'Calves',     rec:30, cap:8},
  {k:'core',     n:'Abs',        rec:30, cap:8},
  {k:'forearms', n:'Forearms',   rec:32, cap:6}
];
const M = {}; MUSCLES.forEach(m => M[m.k] = m);
const MK = MUSCLES.map(m => m.k);

/* ---------- training groups ----------
   Tracking stays per muscle — that is the only way to see that triceps are
   starved while chest is stuffed. Groups are a display and planning layer on
   top, matching how sessions actually get organised. Every muscle belongs to
   exactly one group, so nothing can fall off the bottom of a list again. */
const GROUPS = [
  {k:'chesttri', n:'Chest & Triceps', m:['chest','triceps']},
  {k:'backbi',   n:'Back & Biceps',   m:['back','biceps','reardelts','forearms']},
  {k:'sholabs',  n:'Shoulders & Abs', m:['delts','core']},
  {k:'legs',     n:'Legs',            m:['quads','hams','glutes','calves']}
];
const GOF = {}; GROUPS.forEach(g => g.m.forEach(k => GOF[k] = g));
/* fail loudly in the console if a muscle is ever added without a group */
MK.forEach(k => { if(!GOF[k]) console.error('SetClock: muscle "' + k + '" is in no group'); });

const EQUIP = ['barbell','dumbbell','machine','cable','smith','bodyweight','kettlebell','band'];
const EQ_LABEL = {barbell:'Barbell',dumbbell:'Dumbbell',machine:'Machine',cable:'Cable',smith:'Smith',bodyweight:'Bodyweight',kettlebell:'Kettlebell',band:'Bands'};

/* token search: every word in the query must appear somewhere in the name or an
   alias, ignoring punctuation and a trailing plural s */
const normTxt = s => String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function matchEx(e, q){
  if(!q) return true;
  const hay = normTxt(e.name + ' ' + (e.alias || []).join(' '));
  return q.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean).every(t => {
    const singular = (t.length > 2 && t.slice(-1) === 's') ? t.slice(0, -1) : t;
    return hay.indexOf(t) !== -1 || hay.indexOf(singular) !== -1;
  });
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      state = Object.assign(state, s);
      state.targets = Object.assign({...DEFAULT_TARGETS}, s.targets || {});
      if(!state.setup) state.setup = {};
      if(!state.gyms || !state.gyms.length) state.gyms = [{id:'g_main',name:'Muscle Up',equip:EQUIP.slice()}];

      /* One-time fixup for anyone who loaded the app before the real gym names
         were known. Only touches the untouched placeholder names, so a gym Alex
         has already renamed himself is never clobbered. */
      if(!state.gymsNamed){
        const main = state.gyms.find(g => g.name === 'Main Gym');
        if(main) main.name = 'Muscle Up';
        if(!state.gyms.some(g => /centene/i.test(g.name))){

                           equip:['dumbbell','machine','cable','bodyweight','band']});

/* Storage health. The old save() swallowed every exception behind a toast, so
   when the browser refused to persist (sandboxed frame, private mode, full
   quota) the app kept working from memory and quietly lost everything on
   reload. That is what ate a leg session. Now a failure is loud and sticky. */
let storageOK = null, lastSave = 0, saveErr = '';
function errText(e){
  const n = e && e.name;
  if(n === 'SecurityError')          return 'this page is sandboxed and cannot store data';
  if(n === 'QuotaExceededError')     return 'the storage quota is full';
  if(/private/i.test((e && e.message) || '')) return 'private browsing blocks storage';
  return String((e && e.message) || 'storage unavailable').replace(/\.$/, '');
}
function checkStorage(){
  try{
    localStorage.setItem('__sc_probe__', '1');
    const ok = localStorage.getItem('__sc_probe__') === '1';
    localStorage.removeItem('__sc_probe__');
    storageOK = ok;
    if(!ok) saveErr = 'this browser accepted the write but read back nothing';
  }catch(e){
    storageOK = false;
    saveErr = errText(e);
  }
  return storageOK;
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
    lastSave = Date.now(); storageOK = true; saveErr = '';
  }catch(e){
    storageOK = false;
    saveErr = errText(e);
    toast('NOT SAVED — export now');
  }
}
/* red bar pinned to every screen while writes are failing, with a one-tap
   escape hatch, because a warning you can dismiss is a warning you will lose */
function storageBanner(){
  if(storageOK !== false) return '';
  return '<div class="card" style="border-color:var(--bad);background:rgba(248,113,113,.12)">'
       + '<div class="row" style="gap:8px"><span class="dot b-bad"></span>'
       + '<h3 style="font-size:14px" class="g-bad">Nothing is being saved</h3></div>'
       + '<div class="sm" style="margin-top:8px;color:var(--dim)">This browser will not keep your log — '
       + esc(saveErr) + '. Anything you enter disappears when the page reloads.</div>'
       + '<button class="btn wide" style="margin-top:10px" data-act="export">Download a backup now</button></div>';
}

const allEx = () => LIB.concat(state.customEx || []);
const exById = id => allEx().find(e => e.id === id);
const gymById = id => state.gyms.find(g => g.id === id) || state.gyms[0];
const activeGym = () => gymById(state.activeGym);

/* ---------- time ---------- */
const HR = 3600000, DAY = 86400000;
function weekStartOf(d){                    // weeks run Sunday 00:00 -> Saturday 23:59
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - x.getDay());      // getDay(): Sun = 0
  return x.getTime();
}
const thisWeek = () => weekStartOf(new Date());
const dayKey = ts => { const d = new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function fmtDay(ts){
  const d = new Date(ts), t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((t - new Date(d).setHours(0,0,0,0)) / DAY);
  if(diff === 0) return 'Today';
  if(diff === 1) return 'Yesterday';
  return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
}
function fmtAgo(ms){
  const h = ms / HR;
  if(h < 1) return Math.max(1, Math.round(ms/60000)) + 'm ago';
  if(h < 48) return Math.round(h) + 'h ago';
  return Math.round(h/24) + 'd ago';
}
function fmtIn(ms){
  const h = ms / HR;
  if(h < 1) return 'in ' + Math.max(1, Math.round(ms/60000)) + 'm';
  if(h < 36) return 'in ' + Math.round(h) + 'h';
  return 'in ' + (Math.round(h/24*10)/10) + 'd';
}

/* ---------- volume engine ----------
   A set counts 1.0 toward its primary muscle and 0.5 toward each secondary.
   That is the "effective set" convention most volume research uses, and it is
   what keeps rows / deadlifts from silently inflating a direct-biceps target. */
function creditsFor(exId){
  const e = exById(exId);
  if(!e) return {};
  const c = {}; c[e.primary] = 1;
  (e.secondary || []).forEach(m => { c[m] = (c[m] || 0) + 0.5; });
  return c;
}
function volume(sets){
  const v = {}; MK.forEach(k => v[k] = 0);
  sets.forEach(s => { const c = creditsFor(s.exId); for(const k in c) v[k] = (v[k] || 0) + c[k]; });
  return v;
}
const setsInWeek = ws => state.sets.filter(s => s.ts >= ws && s.ts < ws + 7*DAY);
const setsToday = () => { const k = dayKey(Date.now()); return state.sets.filter(s => dayKey(s.ts) === k); };

/* last meaningful hit of a muscle: the most recent DAY on which it got >= 1.5
   effective sets. A single incidental 0.5 credit does not restart the clock. */
function lastHit(mk){
  const byDay = {};
  state.sets.forEach(s => {
    const c = creditsFor(s.exId)[mk]; if(!c) return;
    const k = dayKey(s.ts);
    if(!byDay[k]) byDay[k] = {sets:0, ts:0};
    byDay[k].sets += c;
    byDay[k].ts = Math.max(byDay[k].ts, s.ts);
  });
  let best = null;
  for(const k in byDay){
    if(byDay[k].sets < 1.5) continue;
    if(!best || byDay[k].ts > best.ts) best = byDay[k];
  }
  return best;                                // {sets, ts} or null
}
function recovery(mk){
  const hit = lastHit(mk);
  if(!hit) return {ready:1, hours:0, since:null, readyAt:null, sets:0, stale:false, never:true};
  const base = M[mk].rec;
  const hours = base * Math.min(1.4, Math.max(.55, .55 + .075 * hit.sets));
  const since = Date.now() - hit.ts;
  return {
    ready: Math.min(1, since / (hours * HR)),
    hours, since,
    readyAt: hit.ts + hours * HR,
    sets: hit.sets,
    stale: since > 5 * DAY
  };
}

/* week pacing */
function weekInfo(){
  const ws = thisWeek(), we = ws + 7*DAY, now = Date.now();
  const daysLeft = Math.max(1, Math.ceil((we - now) / DAY));       // includes today
  const wSets = setsInWeek(ws);
  const trainedDays = new Set(wSets.map(s => dayKey(s.ts))).size;
  const todayTrained = setsToday().length > 0;
  // sessions still available this week, bounded by both the plan and the calendar
  const plannedLeft = Math.max(0, state.daysPerWeek - trainedDays);
  const sessionsLeft = Math.max(todayTrained ? 0 : 1, Math.min(plannedLeft + (todayTrained ? 1 : 0), daysLeft));
  return {ws, we, now, daysLeft, wSets, trainedDays, todayTrained,
          sessionsLeft: Math.max(1, sessionsLeft),
          elapsed:(now - ws) / (7*DAY)};
}

/* priority: what deserves sets today, and how many */
function priorities(){
  const w = weekInfo();
  const done = volume(w.wSets);
  const doneToday = volume(setsToday());
  return MUSCLES.map(m => {
    const target = state.targets[m.k] || 0;
    const d = done[m.k] || 0;
    const deficit = Math.max(0, target - d);
    const rec = recovery(m.k);
    const dt = doneToday[m.k] || 0;
    const allow = dayAllowance(m.k);
    // sets still owed TODAY: what is left of today's allowance, never more than
    // the week still owes
    const suggest = Math.max(0, Math.min(deficit, allow - dt));
    const hitsLeft = Math.max(0, Math.max(1, state.freq || 2) - hitsThisWeek(m.k));
    const needPerSession = target ? deficit / Math.max(1, hitsLeft || 1) : 0;
    const gap = target ? deficit / target : 0;
    // a muscle already at its day allowance drops out of today's ranking
    const todayPenalty = suggest > 0 ? 1 : 0;
    const score = target ? gap * rec.ready * (1 + Math.min(1.5, needPerSession / 6)) * todayPenalty : 0;
    return {m, target, done:d, doneToday:dt, allow, hitsLeft, deficit, rec, score, suggest, needPerSession};
  }).sort((a,b) => b.score - a.score);
}

/* roll the per-muscle picture up into training groups.
   `done` is capped at each muscle's own target before summing, so a group
   cannot read as finished because one muscle is stuffed while another starves. */
function groupStats(P){
  const byM = {}; P.forEach(p => byM[p.m.k] = p);
  return GROUPS.map(g => {
    const parts = g.m.map(k => byM[k]).filter(Boolean);
    const target  = parts.reduce((t,p) => t + p.target, 0);
    const counted = parts.reduce((t,p) => t + Math.min(p.done, p.target), 0);
    const raw     = parts.reduce((t,p) => t + p.done, 0);
    const deficit = parts.reduce((t,p) => t + p.deficit, 0);
    const ready   = parts.length ? parts.reduce((t,p) => t + p.rec.ready, 0) / parts.length : 1;
    const score   = parts.length ? Math.max.apply(null, parts.map(p => p.score)) : 0;
    const lag     = parts.filter(p => p.target && p.deficit > 0)
                         .sort((a,b) => (b.deficit/b.target) - (a.deficit/a.target));
    return {g, parts, target, counted, raw, deficit, ready, score, lag};
  }).sort((a,b) => b.score - a.score);
}

/* What a catch-up session at the end of the week would have to contain.
   Small, fast-recovering muscles come first: they are both the ones that get
   skipped and the only ones you can safely hit again on short notice. */
function weekCloser(){
  const w = weekInfo();
  const cands = priorities()
    .filter(p => p.target > 0 && p.deficit >= 1)
    .map(p => ({
      p,
      cheap: M[p.m.k].rec <= 44 && p.rec.ready >= .8,
      sets: Math.min(M[p.m.k].cap, Math.ceil(p.deficit))
    }))
    .sort((a,b) => (b.cheap - a.cheap) || (b.p.deficit - a.p.deficit));
  return {w, cheap: cands.filter(c => c.cheap), heavy: cands.filter(c => !c.cheap)};
}

/* Which movements actually produced a muscle's weekly volume, and how much of
   it was direct work vs a half-credit from something else. This is the answer
   to "why does my triceps say 6.5 when I only did 3 pushdowns". */
function contributions(mk){
  const byEx = {};
  setsInWeek(thisWeek()).forEach(s => {
    const per = creditsFor(s.exId)[mk];
    if(!per) return;
    if(!byEx[s.exId]) byEx[s.exId] = {exId:s.exId, sets:0, credit:0, per, ts:0, gyms:{}};
    const e = byEx[s.exId];
    e.sets++; e.credit += per;
    e.ts = Math.max(e.ts, s.ts);
    e.gyms[s.gymId] = 1;
  });
  return Object.keys(byEx).map(k => byEx[k]).sort((a,b) => b.credit - a.credit);
}

/* most recent set of a movement — same gym first, since the loadable weights
   differ between gyms and a Centene dumbbell number is useless at Muscle Up */
function lastSetFor(exId){
  const hist = state.sets.filter(s => s.exId === exId).sort((a,b) => b.ts - a.ts);
  return hist.find(s => s.gymId === state.activeGym) || hist[0] || null;
}

/* Build a ready-to-run session for one group at the current gym.
   Sets come from what each muscle still owes divided by the sessions left, so
   the same group produces a big session early in the week and a short mop-up
   at the end. Movements you have done before sort first — their weights are
   already known, so the session arrives pre-filled rather than blank. */
function buildSession(gk){
  const gr = GROUPS.find(x => x.k === gk);
  const g = activeGym();
  const byM = {}; priorities().forEach(p => byM[p.m.k] = p);
  const recent = {}; state.sets.forEach(s => { recent[s.exId] = Math.max(recent[s.exId] || 0, s.ts); });
  const todayByEx = {}; setsToday().forEach(s => { todayByEx[s.exId] = (todayByEx[s.exId] || 0) + 1; });

  /* One session = one day's allowance per muscle (weekly target ÷ frequency),
     minus whatever is already logged today. Big sessions by design: dividing
     the debt across every remaining day was what produced 2-set chest days. */
  const SESSION_MAX = 34;   // sets in one sitting before it stops being a session
  const PER_MOVE_MAX = 4;   // beyond this, junk volume on the same movement

  const plan = [], used = {}, missing = [], deferred = [];
  let budget = SESSION_MAX;

  gr.m.forEach(mk => {
    const p = byM[mk];
    if(!p || !p.target || p.deficit <= 0) return;
    let need = p.suggest;
    if(need <= 0) return;                       // day allowance already used up

    const cands = allEx().filter(e => e.primary === mk && g.equip.includes(e.equip) && !used[e.id]);
    if(!cands.length){ missing.push(M[mk].n); return; }
    cands.sort((a,b) => {
      const ak = recent[a.id] ? 0 : 1, bk = recent[b.id] ? 0 : 1;
      if(ak !== bk) return ak - bk;                       // lifts with history first
      if(a.secondary.length !== b.secondary.length) return b.secondary.length - a.secondary.length; // compounds first
      return (recent[b.id] || 0) - (recent[a.id] || 0);
    });

    // the whole group cannot exceed one session; later muscles get deferred,
    // which is exactly what the end-of-week light session is for
    if(budget <= 0){ deferred.push(M[mk].n); return; }
    if(need > budget){ deferred.push(M[mk].n); need = budget; }

    // spread over enough movements that none carries more than PER_MOVE_MAX,
    // and shrink the ask when the gym does not have enough movements for it
    const nMoves = Math.min(cands.length, Math.ceil(need / PER_MOVE_MAX));
    const picks = cands.slice(0, nMoves);
    const capacity = picks.length * PER_MOVE_MAX;
    if(need > capacity){ deferred.push(M[mk].n); need = capacity; }

    let left = need;
    picks.forEach((e, i) => {
      const sets = Math.min(PER_MOVE_MAX, Math.ceil(left / (picks.length - i)));
      if(sets <= 0) return;
      left -= sets; budget -= sets;
      used[e.id] = 1;
      plan.push({ex:e, mk, sets, done: todayByEx[e.id] || 0, last: lastSetFor(e.id)});
    });
  });
  return {gr, gym:g, plan, missing,
          deferred: deferred.filter((v,i,a) => a.indexOf(v) === i),
          total: plan.reduce((t,x) => t + x.sets, 0)};
}

/* est 1RM (Epley), used for the per-exercise trend */
const e1rm = (w, r) => (!w || !r) ? 0 : Math.round(w * (1 + r/30));

/* ---------- personal records ----------
   Weekly set counts reset every Sunday. Sets and PRs never do — `state.sets` is
   append-only and PRs are recomputed from the whole history, so a reset can
   never take a record with it. */
function prFor(exId){
  const hist = state.sets.filter(s => s.exId === exId);
  if(!hist.length) return null;
  let heaviest = null, best1rm = null, bestVol = null;
  hist.forEach(s => {
    if(!heaviest || s.weight > heaviest.weight ||
       (s.weight === heaviest.weight && s.reps > heaviest.reps)) heaviest = s;
    if(!best1rm || e1rm(s.weight, s.reps) > e1rm(best1rm.weight, best1rm.reps)) best1rm = s;
    if(!bestVol || s.weight * s.reps > bestVol.weight * bestVol.reps) bestVol = s;
  });
  return {heaviest, best1rm, bestVol, count:hist.length};
}

/* Does this set beat the all-time record? Called BEFORE the set is stored, so
   the comparison is against history that does not yet include it. */
function prCheck(exId, weight, reps){
  const pr = prFor(exId);
  if(!pr) return {kind:'first', label:'first time logged'};
  const hits = [];
  if(weight > pr.heaviest.weight) hits.push('heaviest ever at ' + weight + state.unit);
  else if(weight === pr.heaviest.weight && reps > pr.heaviest.reps) hits.push('most reps at ' + weight + state.unit);
  if(e1rm(weight, reps) > e1rm(pr.best1rm.weight, pr.best1rm.reps)) hits.push('best est. 1RM ' + e1rm(weight, reps) + state.unit);
  return hits.length ? {kind:'pr', label:hits.join(' · ')} : null;
}

/* One day's allowance for a muscle: the whole weekly target divided by how many
   times a week it gets trained. At freq 2 that is 6 chest sets in a sitting, at
   freq 1 it is all 12. This replaced dividing by remaining *sessions*, which
   produced the 2-set days Alex rejected. */
function dayAllowance(mk){
  const freq = Math.max(1, state.freq || 2);
  return Math.max(2, Math.ceil((state.targets[mk] || 0) / freq));
}

/* Traffic light, volume-driven per Alex's spec:
     green  = keep going, more sets owed today
     yellow = enough of this muscle for TODAY, stop
     red    = weekly target met, done for the week
   Red means "finished", not "bad" — the legend says so. Recovery still drives
   how groups are ranked, but it deliberately does not drive this light: at 1-2
   sessions a week the recovery window is never the binding constraint. */
function light(p){
  if(!p.target)                       return {c:'dim2', t:'not tracked'};
  if(p.deficit <= 0)                  return {c:'bad',  t:'done for the week'};
  if(p.doneToday >= dayAllowance(p.m.k)) return {c:'warn', t:'enough for today'};
  return {c:'acc', t:'go'};
}

/* how many separate days this week a muscle got real work */
function hitsThisWeek(mk){
  const byDay = {};
  setsInWeek(thisWeek()).forEach(s => {
    const c = creditsFor(s.exId)[mk]; if(!c) return;
    const k = dayKey(s.ts); byDay[k] = (byDay[k] || 0) + c;
  });
  return Object.keys(byDay).filter(k => byDay[k] >= 1.5).length;
}

/* soreness decays: a report older than 48h stops counting */
function soreness(mk){
  const s = (state.soreness || {})[mk];
  if(!s || Date.now() - s.ts > 48*HR) return null;
  return s;
}
const SORE_LABEL = ['Fine', 'Mild', 'Sore', 'Very sore'];

function statusOf(p){
  if(!p.target) return {c:'dim', t:'off plan'};
  if(p.deficit <= 0) return {c:'acc', t:'target met'};
  if(p.rec.never) return {c:'acc', t:'open'};
  if(p.rec.ready < .7) return {c:'blue', t:'recovering'};
  if(p.rec.ready < 1) return {c:'blue', t:'ready soon'};
  if(p.rec.stale && p.deficit > p.target * .5) return {c:'bad', t:'going cold'};
  if(p.needPerSession > M[p.m.k].cap) return {c:'bad', t:'behind'};
  if(p.needPerSession > M[p.m.k].cap * .7) return {c:'warn', t:'push today'};
  return {c:'acc', t:'ready'};
}

/* ============================ TODAY ============================ */
function viewToday(){
  const w = weekInfo(), P = priorities();
  const done = volume(w.wSets);

  MK.forEach(k => { totDone += Math.min(done[k] || 0, state.targets[k] || 0); totTarget += state.targets[k] || 0; });
  const pct = totTarget ? totDone / totTarget : 0;
  const expected = Math.min(1, w.elapsed);
  const paceDelta = pct - expected;
  const paceTxt = paceDelta > .06 ? ['ahead of pace','g-acc'] : paceDelta < -.12 ? ['behind pace','g-bad'] : paceDelta < -.05 ? ['slightly behind','g-warn'] : ['on pace','g-acc'];
  const todaySets = setsToday();

  let h = '';

  // week clock
  h += '<div class="card">';
  h += '<div class="row"><div><h2 style="font-size:17px">This week</h2>'
     + '<div class="sm muted" style="margin-top:3px">' + w.daysLeft + ' day' + (w.daysLeft>1?'s':'') + ' left · '
     + w.trainedDays + ' of ' + state.daysPerWeek + ' sessions done</div></div>'
     + '<div class="pnum"><b class="mono">' + Math.round(totDone) + '<span class="muted" style="font-size:14px">/' + totTarget + '</span></b><s>sets banked</s></div></div>';
  h += '<div class="bar" style="margin-top:12px"><i style="width:' + (pct*100).toFixed(1) + '%"></i>'
     + '<div class="mark" style="left:' + (expected*100).toFixed(1) + '%"></div></div>';
  h += '<div class="row tiny" style="margin-top:7px"><span class="' + paceTxt[1] + '" style="font-weight:700">' + paceTxt[0] + '</span>'
     + '<span class="sp muted">marker = where you should be</span></div>';
  h += '</div>';

  // today so far
  if(todaySets.length){
    const tv = volume(todaySets);
    const parts = MK.filter(k => tv[k] > 0).sort((a,b) => tv[b]-tv[a])
      .map(k => '<span class="chip">' + M[k].n + ' ' + (Math.round(tv[k]*10)/10) + '</span>').join('');
    h += '<div class="card"><div class="row"><h3 style="font-size:14px">Logged today</h3>'
       + '<span class="sp sm muted">' + todaySets.length + ' sets · ' + esc(gymById(todaySets[todaySets.length-1].gymId).name) + '</span></div>'
       + '<div class="chips" style="margin-top:10px">' + parts + '</div></div>';
  }

  // group cards — every muscle appears under exactly one, nothing gets truncated
  h += '<div class="sect">Groups · ranked by what needs work</div>';
  h += '<div class="card" style="padding:10px 12px"><div class="row tiny" style="gap:12px;flex-wrap:wrap">'
     + '<span class="row" style="gap:6px"><span class="dot b-acc"></span><span class="muted">keep going</span></span>'
     + '<span class="row" style="gap:6px"><span class="dot b-warn"></span><span class="muted">enough for today</span></span>'
     + '<span class="row" style="gap:6px"><span class="dot b-bad"></span><span class="muted">done for the week</span></span>'
     + '</div></div>';
  const G = groupStats(P);
  G.forEach(gr => {
    const pct = gr.target ? gr.counted / gr.target * 100 : 0;
    const st = gr.deficit <= 0 ? {c:'acc', t:'complete'}
             : gr.ready < .7   ? {c:'blue', t:'still recovering'}
             : gr.lag.length && gr.lag[0].needPerSession > M[gr.lag[0].m.k].cap ? {c:'bad', t:'cannot finish'}
             : gr.ready < 1    ? {c:'blue', t:'ready soon'}
             : {c:'acc', t:'ready'};
    h += '<div class="card"><button class="row" data-act="session" data-g="' + gr.g.k
       + '" style="width:100%;text-align:left;background:none;padding:0">'
       + '<div class="fl"><h3 style="font-size:15px">' + gr.g.n
       + ' <span class="tiny g-' + st.c + '" style="font-weight:700">· ' + st.t + '</span></h3>'
       + '<div class="tiny" style="color:var(--blue);margin-top:3px;font-weight:600">Tap for a session at ' + esc(activeGym().name) + ' ›</div></div>'
       + '<div class="pnum"><b class="mono g-' + st.c + '">' + (Math.round(gr.counted*10)/10)
       + '<span class="muted" style="font-size:13px">/' + gr.target + '</span></b><s>group sets</s></div></button>';
    h += '<div class="bar" style="margin:10px 0 4px"><i class="' + (gr.deficit<=0?'b-acc':pct>60?'b-warn':'b-bad') + '" style="width:' + pct + '%"></i></div>';

    gr.parts.forEach(p => {
      const L = light(p);
      const so = soreness(p.m.k);
      const when = p.deficit <= 0        ? 'target met — leave it alone'
                 : p.suggest <= 0        ? p.doneToday + ' sets logged today — come back next session'
                 : p.rec.since == null   ? 'never trained'
                 : 'last hit ' + fmtAgo(p.rec.since) + ' · ' + p.hitsLeft + ' session' + (p.hitsLeft===1?'':'s') + ' left this week'
      h += '<button class="prow" data-act="muscle" data-m="' + p.m.k + '" style="width:100%;text-align:left;background:none;padding:9px 0">'

         + '<div class="fl"><div class="nm" style="font-size:14px">' + p.m.n
         + (so && so.lvl >= 2 ? ' <span class="tiny g-warn">· ' + SORE_LABEL[so.lvl].toLowerCase() + '</span>' : '') + '</div>'
         + '<div class="sub">' + when + '</div></div>'

         + (Math.round(p.done*10)/10) + '/' + p.target + '</div>'
         + '<div class="pnum" style="width:44px"><b style="font-size:16px" class="g-' + L.c + '">'
         + (p.deficit <= 0 ? '■' : p.suggest > 0 ? p.suggest : '✓') + '</b></div></button>';
    });
    h += '</div>';
  });

  // end-of-week catch-up plan
  const cl = weekCloser();
  if((cl.cheap.length || cl.heavy.length) && w.daysLeft <= 3){
    const g2 = activeGym();
    h += '<div class="card" style="border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.06)">'
       + '<div class="row" style="gap:8px"><span class="dot b-warn"></span><h3 style="font-size:15px" class="g-warn">Close out the week</h3>'
       + '<span class="sp tiny muted">' + w.daysLeft + ' day' + (w.daysLeft>1?'s':'') + ' left</span></div>';
    if(cl.cheap.length){
      h += '<div class="sm" style="margin-top:10px;color:var(--dim)">A light session clears these — small muscles, recovered, cheap to repeat:</div>'
         + '<div class="chips" style="margin-top:8px">'
         + cl.cheap.map(c => '<span class="chip on">' + c.p.m.n + ' ' + c.sets + '</span>').join('')
         + '</div>';
      const total = cl.cheap.reduce((t,c) => t + c.sets, 0);
      h += '<div class="tiny muted" style="margin-top:8px">' + total + ' sets total. '
         + (total <= 20
            ? 'None of these need a full recovery window, so it fits on a rest day.'
            : 'That is too much to be a light day — take the ones you care about most and let the rest go.')
         + '</div>';
    }
    if(cl.heavy.length){
      h += '<div class="sm" style="margin-top:12px;color:var(--dim)">These need a real session, not a light one:</div>'
         + '<div class="chips" style="margin-top:8px">'
         + cl.heavy.map(c => '<span class="chip">' + c.p.m.n + ' ' + c.sets
             + (c.p.rec.ready < .8 ? ' <span class="g-blue">· sore</span>' : '') + '</span>').join('')
         + '</div>';
      const impossible = cl.heavy.filter(c => c.p.needPerSession > M[c.p.m.k].cap);
      if(impossible.length){
        h += '<div class="tiny g-bad" style="margin-top:8px">'
           + impossible.map(c => c.p.m.n).join(', ') + ' cannot be closed in the sessions left. '
           + 'Take the miss rather than cramming it — or lower the target in Plan if it misses every week.</div>';
      }
    }
    h += '</div>';
  }

  // suggested exercises at the current gym, for the group that most needs work
  const g = activeGym();
  const lead = G[0];
  const wants = lead ? lead.lag.slice(0,3).map(p => p.m.k) : [];
  if(wants.length){
    const picks = [];
    wants.forEach(mk => {
      const recent = {};
      state.sets.forEach(s => { recent[s.exId] = Math.max(recent[s.exId] || 0, s.ts); });
      const cands = allEx().filter(e => e.primary === mk && g.equip.includes(e.equip));
      cands.sort((a,b) => (recent[b.id] || 0) - (recent[a.id] || 0));

      if(cands[1]) picks.push({ex:cands[1], mk});
    });
    if(picks.length){
      h += '<div class="sect">' + esc(lead.g.n) + ' at ' + esc(g.name) + '</div>';
      picks.slice(0,6).forEach(p => {
        h += '<button class="ex" data-act="pick" data-ex="' + p.ex.id + '">'
           + '<div class="fl"><div class="nm">' + esc(p.ex.name) + '</div>'
           + '<div class="mt">' + M[p.ex.primary].n + (p.ex.secondary.length ? ' + ' + p.ex.secondary.map(m => M[m].n).join(', ') : '') + '</div></div>'
           + '<span class="tag">' + EQ_LABEL[p.ex.equip] + '</span></button>';
      });
    }
  }

  h += '<div style="height:8px"></div>';
  return h;
}

/* ============================ LOG ============================ */
function lastLineFor(exId){
  const setup = getSetup(exId);
  const tail = setup ? ' · <span class="g-blue">⚙ ' + esc(setup) + '</span>' : '';
  const hist = state.sets.filter(s => s.exId === exId).sort((a,b) => b.ts - a.ts);
  if(!hist.length) return 'never logged' + tail;
  const l = hist[0];
  return l.weight + state.unit + ' × ' + l.reps + ' · ' + fmtDay(l.ts) + ' · ' + esc(gymById(l.gymId).name) + tail;
}
function viewLog(){
  const g = activeGym();
  let h = '';

  h += '<div class="card" style="padding:11px 12px"><div class="row" style="gap:8px">'
     + '<span class="tiny muted" style="font-weight:700">GYM</span>'
     + '<div class="chips sp" style="justify-content:flex-end">'
     + state.gyms.map(x => '<button class="chip ' + (x.id === g.id ? 'on' : '') + '" data-act="setgym" data-g="' + x.id + '">' + esc(x.name) + '</button>').join('')
     + '<button class="chip" data-act="addgym">+</button></div></div></div>';

  h += '<input id="exSearch" placeholder="Search 100+ movements…" value="' + esc(exFilter) + '" autocomplete="off" autocorrect="off">';

  h += '<div class="chips" style="margin-top:9px">'
     + '<button class="chip ' + (exMuscleFilter === '' ? 'on' : '') + '" data-act="mfilter" data-m="">All</button>'
     + GROUPS.map(gr => '<button class="chip ' + (exMuscleFilter === 'g:'+gr.k ? 'on' : '') + '" data-act="mfilter" data-m="g:' + gr.k + '">' + gr.n + '</button>').join('')
     + '</div>';
  h += '<div class="chips" style="margin-top:7px">'
     + MUSCLES.map(m => '<button class="chip ' + (exMuscleFilter === m.k ? 'on' : '') + '" data-act="mfilter" data-m="' + m.k + '">' + m.n + '</button>').join('')
     + '</div>';

  const q = exFilter.trim().toLowerCase();
  const recentIds = [];
  state.sets.slice().sort((a,b) => b.ts - a.ts).forEach(s => { if(!recentIds.includes(s.exId)) recentIds.push(s.exId); });

  let list = allEx().filter(e => {
    if(exMuscleFilter.slice(0,2) === 'g:'){
      const gr = GROUPS.find(x => x.k === exMuscleFilter.slice(2));
      // group filter is primary-only: a group view should show the movements that
      // train it, not every lift that brushes it with half a credit
      if(gr && !gr.m.includes(e.primary)) return false;
    } else if(exMuscleFilter && e.primary !== exMuscleFilter && !e.secondary.includes(exMuscleFilter)) return false;
    if(!matchEx(e, q)) return false;
    return true;
  });
  // gym-available first, then recency, then name
  list.sort((a,b) => {
    const ag = g.equip.includes(a.equip) ? 0 : 1, bg = g.equip.includes(b.equip) ? 0 : 1;
    if(ag !== bg) return ag - bg;
    const ar = recentIds.indexOf(a.id), br = recentIds.indexOf(b.id);
    const av = ar === -1 ? 999 : ar, bv = br === -1 ? 999 : br;
    if(av !== bv) return av - bv;
    return a.name.localeCompare(b.name);
  });

  h += '<div class="sect">' + list.length + ' movements</div>';
  if(!list.length) h += '<div class="empty">Nothing matches. Add it as a custom movement in Plan.</div>';
  list.slice(0, 60).forEach(e => {
    const avail = g.equip.includes(e.equip);
    h += '<button class="ex" data-act="pick" data-ex="' + e.id + '" style="' + (avail ? '' : 'opacity:.45') + '">'
       + '<div class="fl"><div class="nm">' + esc(e.name) + '</div>'
       + '<div class="mt">' + M[e.primary].n + (e.secondary.length ? ' <span style="color:var(--dim2)">+ ' + e.secondary.map(m => M[m].n).join(', ') + '</span>' : '')
       + ' · ' + lastLineFor(e.id) + '</div></div>'
       + '<span class="tag">' + EQ_LABEL[e.equip] + '</span></button>';
  });
  if(list.length > 60) h += '<div class="tiny muted" style="text-align:center;padding:8px">Showing 60 of ' + list.length + ' — keep typing to narrow.</div>';
  return h;
}

/* logging sheet */
let draft = {weight:0, reps:8, rpe:''};
function sheetLog(exId){
  logEx = exId;
  const e = exById(exId);
  const hist = state.sets.filter(s => s.exId === exId).sort((a,b) => b.ts - a.ts);
  const sameGym = hist.filter(s => s.gymId === state.activeGym);
  const seed = sameGym[0] || hist[0];
  draft = {weight: seed ? seed.weight : 0, reps: seed ? seed.reps : 8, rpe:''};
  renderLogSheet();
}
function renderLogSheet(){
  const e = exById(logEx); if(!e) return;
  const g = activeGym();
  const today = setsToday().filter(s => s.exId === logEx);
  const hist = state.sets.filter(s => s.exId === logEx).sort((a,b) => b.ts - a.ts);
  const best = hist.reduce((b,s) => e1rm(s.weight,s.reps) > (b ? e1rm(b.weight,b.reps) : 0) ? s : b, null);
  const c = creditsFor(logEx);

  const back = sessionCtx ? GROUPS.find(x => x.k === sessionCtx) : null;
  let h = '<div class="sheeth">'
        + (back ? '<button class="btn sm ghost" style="padding:4px 0;color:var(--blue);margin-bottom:4px" data-act="session" data-g="' + back.k + '">‹ ' + back.n + '</button>' : '')
        + '<div class="row"><div class="fl"><h2 style="font-size:18px">' + esc(e.name) + '</h2>'
        + '<div class="tiny muted" style="margin-top:3px">' + EQ_LABEL[e.equip] + ' · ' + esc(g.name) + '</div></div>'
        + '<button class="btn sm" data-act="closesheet">Done</button></div></div>';

  h += '<div class="row tiny" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">'
     + Object.keys(c).map(k => '<span class="chip">' + M[k].n + ' +' + c[k] + '</span>').join('') + '</div>';

  const prev = hist.find(s => dayKey(s.ts) !== dayKey(Date.now()));
  const pr = prFor(logEx);
  h += '<div class="card" style="padding:11px 13px"><div class="row sm">'
     + '<div><div class="tiny muted">Last time</div><div style="font-weight:650;margin-top:2px">'
     + (prev ? prev.weight + state.unit + ' × ' + prev.reps + ' <span class="muted tiny">' + fmtDay(prev.ts) + '</span>' : '—') + '</div></div>'
     + '<div class="sp" style="text-align:right"><div class="tiny muted">🏆 All-time best</div><div style="font-weight:650;margin-top:2px">'
     + (pr ? pr.heaviest.weight + state.unit + ' × ' + pr.heaviest.reps : '—') + '</div></div></div>'
     + (pr ? '<div class="tiny muted" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">'
           + 'Best est. 1RM ' + e1rm(pr.best1rm.weight, pr.best1rm.reps) + state.unit
           + ' · ' + fmtDay(pr.heaviest.ts) + ' · ' + pr.count + ' sets logged all time</div>' : '')
     + '</div>';

  h += '<div class="row" style="gap:10px;align-items:flex-end">'
     + '<div class="fl"><span class="lbl">Weight (' + state.unit + ')</span><div class="step">'
     + '<button data-act="d" data-f="weight" data-v="-5">−</button>'
     + '<input id="fW" class="fl mono" type="number" inputmode="decimal" step="0.5" value="' + draft.weight + '">'
     + '<button data-act="d" data-f="weight" data-v="5">+</button></div></div>'
     + '<div class="fl"><span class="lbl">Reps</span><div class="step">'
     + '<button data-act="d" data-f="reps" data-v="-1">−</button>'
     + '<input id="fR" class="fl mono" type="number" inputmode="numeric" step="1" value="' + draft.reps + '">'
     + '<button data-act="d" data-f="reps" data-v="1">+</button></div></div></div>';

  h += '<div style="margin-top:12px"><span class="lbl">RPE (optional)</span><div class="chips">'
     + [6,7,7.5,8,8.5,9,10].map(r => '<button class="chip ' + (String(draft.rpe) === String(r) ? 'on' : '') + '" data-act="rpe" data-v="' + r + '">' + r + '</button>').join('')
     + '</div></div>';

  h += '<div style="margin-top:12px"><span class="lbl">Machine setup at ' + esc(g.name) + '</span>'
     + '<input id="fSetup" placeholder="seat 4 · pin 7 · handle B" value="' + esc(getSetup(logEx)) + '"></div>';

  h += '<button class="btn pri wide" style="margin-top:14px" data-act="addset">Log set</button>';
  h += '<div class="grid2" style="margin-top:8px">'
     + '<button class="btn" data-act="rest" data-v="90">Rest 90s</button>'
     + '<button class="btn" data-act="rest" data-v="' + state.restDefault + '">Rest ' + state.restDefault + 's</button></div>';

  if(today.length){
    h += '<div class="sect">Today · ' + today.length + ' sets</div>';
    today.forEach((s, i) => {
      h += '<div class="setline"><span class="idx">' + (i+1) + '</span>'
         + '<span class="mono" style="font-weight:650">' + s.weight + state.unit + ' × ' + s.reps + '</span>'
         + (s.rpe ? '<span class="tiny muted">RPE ' + s.rpe + '</span>' : '')
         + '<span class="tiny muted">' + new Date(s.ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}) + '</span>'
         + '<button class="x" data-act="delset" data-id="' + s.id + '">✕</button></div>';

  const older = hist.filter(s => dayKey(s.ts) !== dayKey(Date.now()));

    h += '<div class="sect">History</div>';
    Object.keys(byDay).sort().reverse().slice(0,6).forEach(k => {
      const arr = byDay[k];
      h += '<div class="setline" style="align-items:flex-start"><div class="fl">'
         + '<div class="sm" style="font-weight:650">' + fmtDay(arr[0].ts) + ' <span class="tiny muted">· ' + esc(gymById(arr[0].gymId).name) + '</span></div>'
         + '<div class="tiny muted" style="margin-top:3px">' + arr.map(s => s.weight + '×' + s.reps).join('  ·  ') + '</div>'
         + '</div><span class="tiny muted">' + arr.length + ' sets</span></div>';
    });
  }
  openSheet(h);

  const su = $('fSetup');
  if(su) su.addEventListener('change', () => {
    const k = setupKey(logEx), v = su.value.trim();
    if(!state.setup) state.setup = {};
    if(v) state.setup[k] = v; else delete state.setup[k];
    save();
    toast(v ? 'Setup saved' : 'Setup cleared');
  });
}

/* ============================ HISTORY ============================ */
function viewHist(){
  if(!state.sets.length) return '<div class="empty">No sets yet. Log one from the Log tab and the clock starts.</div>';
  const byDay = {};
  state.sets.forEach(s => { const k = dayKey(s.ts); (byDay[k] = byDay[k] || []).push(s); });
  let h = '';
  Object.keys(byDay).sort().reverse().slice(0, 40).forEach(k => {
    const arr = byDay[k].slice().sort((a,b) => a.ts - b.ts);
    const v = volume(arr);
    const gyms = [...new Set(arr.map(s => gymById(s.gymId).name))].join(' + ');
    const byEx = {};
    arr.forEach(s => { (byEx[s.exId] = byEx[s.exId] || []).push(s); });
    const tonnage = arr.reduce((t,s) => t + s.weight * s.reps, 0);
    h += '<div class="card"><div class="row"><div><h3 style="font-size:15px">' + fmtDay(arr[0].ts) + '</h3>'
       + '<div class="tiny muted" style="margin-top:3px">' + esc(gyms) + ' · ' + arr.length + ' sets · ' + Math.round(tonnage).toLocaleString() + ' ' + state.unit + ' moved</div></div>'
       + '<button class="btn sm sp ghost" data-act="delday" data-d="' + k + '" style="color:var(--dim2)">✕</button></div>';
    h += '<div class="chips" style="margin:10px 0 4px">'
       + MK.filter(x => v[x] > 0).sort((a,b) => v[b]-v[a]).map(x => '<span class="chip">' + M[x].n + ' ' + (Math.round(v[x]*10)/10) + '</span>').join('') + '</div>';
    Object.keys(byEx).forEach(id => {
      const e = exById(id), ss = byEx[id];
      h += '<div class="setline"><div class="fl"><div class="sm" style="font-weight:600">' + esc(e ? e.name : id) + '</div>'
         + '<div class="tiny muted" style="margin-top:2px">' + ss.map(s => s.weight + '×' + s.reps).join('  ·  ') + '</div></div>'
         + '<span class="tiny muted">' + ss.length + '</span></div>';
    });
    h += '</div>';
  });
  return h;
}

/* ============================ STATS ============================ */
function viewStats(){
  if(!state.sets.length) return '<div class="empty">Stats appear once you have logged a few sessions.</div>';
  let h = '';
  const ws = thisWeek();

  // personal records — all time, never touched by the weekly reset
  const exIds = [];
  state.sets.forEach(s => { if(exIds.indexOf(s.exId) === -1) exIds.push(s.exId); });
  const prs = exIds.map(id => ({id, pr:prFor(id), ex:exById(id)}))
                   .filter(x => x.pr)
                   .sort((a,b) => b.pr.heaviest.ts - a.pr.heaviest.ts);
  const recentPRs = (state.prs || []).slice().sort((a,b) => b.ts - a.ts).slice(0,5);

  h += '<div class="sect">🏆 Personal records</div>';
  h += '<div class="card"><div class="tiny muted">All time, across every gym. Weekly set counts reset each Sunday — these never do.</div>';
  if(recentPRs.length){
    h += '<div style="margin-top:11px">';
    recentPRs.forEach(p => {
      const e = exById(p.exId);
      h += '<div class="row" style="padding:6px 0"><span class="dot b-warn"></span>'
         + '<div class="fl"><div class="sm" style="font-weight:600">' + esc(e ? e.name : p.exId) + '</div>'
         + '<div class="tiny muted" style="margin-top:2px">' + esc(p.label) + '</div></div>'
         + '<span class="tiny muted">' + fmtDay(p.ts) + '</span></div>';
    });
    h += '</div>';
  }
  h += '</div>';

  h += '<div class="card">';
  if(!prs.length) h += '<div class="empty">No records yet.</div>';
  prs.slice(0,40).forEach(x => {
    h += '<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">'
       + '<div class="fl"><div class="sm" style="font-weight:600">' + esc(x.ex ? x.ex.name : x.id) + '</div>'
       + '<div class="tiny muted" style="margin-top:2px">' + x.pr.count + ' sets · last PR ' + fmtDay(x.pr.heaviest.ts) + '</div></div>'
       + '<div style="text-align:right"><div class="mono sm" style="font-weight:700">'
       + x.pr.heaviest.weight + state.unit + ' × ' + x.pr.heaviest.reps + '</div>'
       + '<div class="tiny muted">1RM ' + e1rm(x.pr.best1rm.weight, x.pr.best1rm.reps) + state.unit + '</div></div></div>';
  });
  if(prs.length > 40) h += '<div class="tiny muted" style="text-align:center;padding:8px">+ ' + (prs.length-40) + ' more</div>';
  h += '</div>';

  // 8-week trend of total effective sets
  const weeks = [];
  for(let i = 7; i >= 0; i--){
    const s = ws - i*7*DAY;
    const v = volume(setsInWeek(s));
    weeks.push({s, tot: MK.reduce((t,k) => t + v[k], 0), v});
  }
  const maxW = Math.max(1, ...weeks.map(w => w.tot));
  h += '<div class="card"><div class="row"><h3 style="font-size:15px">Total effective sets</h3><span class="sp tiny muted">last 8 weeks</span></div>'
     + '<div class="wk" style="margin-top:12px">'
     + weeks.map((w,i) => '<i style="height:' + Math.max(3, w.tot/maxW*100) + '%;background:' + (i===7 ? 'var(--acc)' : 'var(--card2)') + '" title="' + Math.round(w.tot) + '"></i>').join('')
     + '</div><div class="row tiny muted" style="margin-top:6px"><span>' + Math.round(weeks[0].tot) + '</span><span class="sp">' + Math.round(weeks[7].tot) + ' this week</span></div></div>';

  // per-muscle this week vs target
  const v = volume(setsInWeek(ws));
  h += '<div class="sect">This week by group</div>';
  GROUPS.forEach(gr => {
    const gt = gr.m.reduce((t,k) => t + (state.targets[k] || 0), 0);
    const gd = gr.m.reduce((t,k) => t + Math.min(v[k] || 0, state.targets[k] || 0), 0);
    h += '<div class="card"><div class="row" style="margin-bottom:10px"><h3 style="font-size:14px">' + gr.n + '</h3>'
       + '<span class="sp mono sm ' + (gt && gd >= gt ? 'g-acc' : 'muted') + '">' + (Math.round(gd*10)/10) + '/' + gt + '</span></div>';
    gr.m.forEach(k => {
      const m = M[k], t = state.targets[k] || 0, d = v[k] || 0;
      const pct = t ? Math.min(100, d/t*100) : 0;
      const cls = !t ? 'b-dim' : d >= t ? 'b-acc' : pct > 60 ? 'b-warn' : 'b-bad';
      h += '<div class="mrow"><div class="mn">' + m.n + '</div><div class="mb"><div class="bar"><i class="' + cls + '" style="width:' + pct + '%"></i></div></div>'
         + '<div class="mv mono muted">' + (Math.round(d*10)/10) + '/' + t + '</div></div>';
    });
    h += '</div>';
  });

  // 4-week average per muscle (are targets realistic?)
  h += '<div class="sect">Prior 4 weeks vs target</div><div class="card"><div class="tiny muted" style="margin-bottom:11px">Average of the last four completed weeks. If a muscle sits far under target every week, the target is fiction — lower it rather than carrying permanent debt.</div>';
  MUSCLES.forEach(m => {
    const avg = weeks.slice(3,7).reduce((t,w) => t + (w.v[m.k] || 0), 0) / 4;
    const t = state.targets[m.k] || 0;
    const gap = t ? (avg - t) : 0;
    h += '<div class="row sm" style="padding:5px 0"><span class="fl">' + m.n + '</span>'
       + '<span class="mono muted" style="width:64px;text-align:right">' + (Math.round(avg*10)/10) + '</span>'
       + '<span class="mono" style="width:64px;text-align:right;color:var(--' + (gap >= -1 ? 'acc' : gap > -4 ? 'warn' : 'bad') + ')">'
       + (gap >= 0 ? '+' : '') + (Math.round(gap*10)/10) + '</span></div>';
  });
  h += '</div>';

  // top movements
  const byEx = {};
  state.sets.forEach(s => { (byEx[s.exId] = byEx[s.exId] || []).push(s); });
  const rank = Object.keys(byEx).map(id => {
    const arr = byEx[id].slice().sort((a,b) => a.ts - b.ts);
    const best = arr.reduce((b,s) => e1rm(s.weight,s.reps) > (b ? e1rm(b.weight,b.reps) : 0) ? s : b, null);
    const first = arr[0], last = arr[arr.length-1];
    return {id, n:arr.length, best, first, last, e: exById(id)};
  }).sort((a,b) => b.n - a.n).slice(0, 12);
  h += '<div class="sect">Most-trained movements</div><div class="card">';
  rank.forEach(r => {
    const delta = e1rm(r.last.weight, r.last.reps) - e1rm(r.first.weight, r.first.reps);
    h += '<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="fl">'
       + '<div class="sm" style="font-weight:600">' + esc(r.e ? r.e.name : r.id) + '</div>'
       + '<div class="tiny muted" style="margin-top:2px">' + r.n + ' sets · best ' + (r.best ? r.best.weight + '×' + r.best.reps : '—') + '</div></div>'
       + '<div style="text-align:right"><div class="mono sm" style="font-weight:650">' + (r.best ? e1rm(r.best.weight, r.best.reps) + state.unit : '—') + '</div>'
       + '<div class="tiny ' + (delta > 0 ? 'g-acc' : delta < 0 ? 'g-bad' : 'muted') + '">' + (delta > 0 ? '+' : '') + delta + ' since start</div></div></div>';
  });
  h += '</div>';
  return h;
}

/* ============================ render ============================ */
function render(){
  $('gymName').textContent = activeGym().name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));
  const v = $('view');
  v.innerHTML = storageBanner()
              + (tab === 'today' ? viewToday()
              :  tab === 'log'   ? viewLog()
              :  tab === 'hist'  ? viewHist()
              :  tab === 'plan'  ? viewPlan()
              :  viewStats());
  if(tab === 'log'){
    const s = $('exSearch');
    s.addEventListener('input', () => { exFilter = s.value; const p = s.selectionStart; render(); const n = $('exSearch'); n.focus(); n.setSelectionRange(p,p); });
  }
  if(tab === 'plan'){
    v.querySelectorAll('[data-tgtin]').forEach(i => i.addEventListener('change', () => {
      state.targets[i.dataset.tgtin] = Math.max(0, Math.round(+i.value || 0)); save(); render();
    }));
    v.querySelectorAll('[data-gymname]').forEach(i => i.addEventListener('change', () => {
      const g = gymById(i.dataset.gymname); g.name = i.value.trim() || 'Gym'; save(); render();
    }));
    const d = $('dpwIn');
    if(d) d.addEventListener('change', () => { state.daysPerWeek = Math.min(7, Math.max(1, Math.round(+d.value || 5))); save(); render(); });
  }
}

/* ---------- rest timer (deadline-based; setInterval drifts when backgrounded) ---------- */
let restDeadline = 0, restTick = null, AC = null;

/* iOS will only let an AudioContext make noise if it was created or resumed
   inside a user gesture, so this is called from the tap that starts the rest —
   not from the tick that ends it. navigator.vibrate does not exist on iPhone. */
function ensureAudio(){
  try{
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return;
    if(!AC) AC = new Ctor();
    if(AC.state === 'suspended') AC.resume();
  }catch(e){ AC = null; }
}
function beep(){
  if(!state.sound || !AC) return;
  try{
    [0, .2, .4].forEach((t, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), at = AC.currentTime + t;
      o.type = 'sine';
      o.frequency.value = i === 2 ? 1245 : 880;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(.4, at + .012);
      g.gain.exponentialRampToValueAtTime(.0001, at + (i === 2 ? .32 : .16));
      o.connect(g); g.connect(AC.destination);
      o.start(at); o.stop(at + .35);
    });
  }catch(e){}
}
function startRest(sec){
  ensureAudio();
  restDeadline = Date.now() + sec*1000;
  $('timer').classList.add('on');
  if(restTick) clearInterval(restTick);
  restTick = setInterval(tickRest, 250); tickRest();
}
function tickRest(){
  const left = Math.max(0, restDeadline - Date.now());
  const s = Math.ceil(left/1000);
  $('timerT').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  if(left <= 0){
    clearInterval(restTick); restTick = null;
    $('timerT').textContent = 'GO';
    beep();
    try{ navigator.vibrate && navigator.vibrate([120,60,120]); }catch(e){}
    setTimeout(() => $('timer').classList.remove('on'), 4000);
  }
}

/* ---------- actions ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act],[data-tab]');
  if(!el) return;
  const a = el.dataset.act;

  if(el.dataset.tab){ tab = el.dataset.tab; sessionCtx = null; closeSheet(); render(); window.scrollTo(0,0); return; }

  switch(a){
    case 'closesheet': closeSheet(); break;

    case 'pickgym': {
      let h = '<div class="sheeth"><div class="row"><h2>Where are you training?</h2><button class="btn sm sp" data-act="closesheet">Done</button></div></div>';
      state.gyms.forEach(g => {
        h += '<button class="ex" data-act="setgym" data-g="' + g.id + '"><div class="fl"><div class="nm">' + esc(g.name)
           + (g.id === state.activeGym ? ' <span class="g-acc">✓</span>' : '') + '</div>'
           + '<div class="mt">' + g.equip.map(q => EQ_LABEL[q]).join(' · ') + '</div></div></button>';
      });
      h += '<button class="btn wide" style="margin-top:8px" data-act="addgym">+ Add a gym</button>';
      openSheet(h); break;
    }
    case 'setgym': state.activeGym = el.dataset.g; save(); closeSheet(); render(); toast(activeGym().name); break;
    case 'addgym': {
      const n = prompt('Gym name'); if(!n) break;
      const g = {id:'g_'+uid(), name:n.trim(), equip:EQUIP.slice()};
      state.gyms.push(g); state.activeGym = g.id; save(); closeSheet(); render();
      toast('Set its equipment in Plan'); break;
    }
    case 'delgym': {
      if(state.gyms.length < 2) break;
      if(!confirm('Remove this gym? Logged sets keep their original tag.')) break;
      state.gyms = state.gyms.filter(g => g.id !== el.dataset.g);
      if(!state.gyms.some(g => g.id === state.activeGym)) state.activeGym = state.gyms[0].id;
      save(); render(); break;
    }
    case 'eq': {
      const g = gymById(el.dataset.g), q = el.dataset.q;
      g.equip = g.equip.includes(q) ? g.equip.filter(x => x !== q) : g.equip.concat(q);
      save(); render(); break;
    }

    case 'muscle': sheetMuscle(el.dataset.m); break;
    case 'sore': {
      if(!state.soreness) state.soreness = {};
      const mk = el.dataset.m, lvl = +el.dataset.v, cur = soreness(mk);
      if(cur && cur.lvl === lvl) delete state.soreness[mk];
      else state.soreness[mk] = {lvl, ts:Date.now()};
      save(); sheetMuscle(mk); render(); break;
    }
    case 'freq': state.freq = +el.dataset.v; save(); render(); break;
    case 'session': sheetSession(el.dataset.g); break;
    case 'pick': {
      // a pick from the main view is a fresh start; only picks made inside a
      // session sheet should keep the back-link to that session
      if(!el.closest('#sheet')) sessionCtx = null;
      closeSheet(); setTimeout(() => sheetLog(el.dataset.ex), 60); break;
    }
    case 'mfilter': exMuscleFilter = el.dataset.m; render(); break;

    case 'd': {
      const f = el.dataset.f, v = +el.dataset.v;
      const inp = f === 'weight' ? $('fW') : $('fR');
      let cur = +inp.value || 0;
      cur = Math.max(0, cur + v);
      inp.value = cur; draft[f] = cur; break;
    }
    case 'rpe': draft.rpe = (String(draft.rpe) === el.dataset.v) ? '' : el.dataset.v; renderLogSheet(); break;

    case 'addset': {
      const w = Math.max(0, +$('fW').value || 0), r = Math.max(1, Math.round(+$('fR').value || 0));
      draft.weight = w; draft.reps = r;
      const hit = prCheck(logEx, w, r);          // compare before storing
      state.sets.push({id:uid(), ts:Date.now(), exId:logEx, gymId:state.activeGym, weight:w, reps:r, rpe:draft.rpe || null});
      if(hit && hit.kind === 'pr'){
        if(!state.prs) state.prs = [];
        state.prs.push({exId:logEx, ts:Date.now(), weight:w, reps:r, label:hit.label});
      }
      save();
      const n = setsToday().filter(s => s.exId === logEx).length;
      if(storageOK !== false) toast(hit && hit.kind === 'pr' ? '🏆 PR — ' + hit.label : 'Set ' + n + ' logged');
      startRest(state.restDefault);
      renderLogSheet();
      render();          // the view behind the sheet was going stale — "not refreshing"
      break;
    }
    case 'rest': startRest(+el.dataset.v); break;
    case 'stoptimer': if(restTick) clearInterval(restTick); restTick = null; $('timer').classList.remove('on'); break;

    case 'delset': state.sets = state.sets.filter(s => s.id !== el.dataset.id); save(); renderLogSheet(); render(); break;
    case 'delday': {
      if(!confirm('Delete every set logged on ' + el.dataset.d + '?')) break;
      state.sets = state.sets.filter(s => dayKey(s.ts) !== el.dataset.d); save(); render(); break;
    }

    case 'tgt': {
      const k = el.dataset.m;
      state.targets[k] = Math.max(0, (state.targets[k] || 0) + (+el.dataset.v));
      save(); render(); break;
    }
    case 'dpw': state.daysPerWeek = Math.min(7, Math.max(1, state.daysPerWeek + (+el.dataset.v))); save(); render(); break;
    case 'unit': state.unit = el.dataset.v; save(); render(); break;
    case 'rdef': state.restDefault = +el.dataset.v; save(); render(); break;
    case 'snd': {
      state.sound = el.dataset.v === '1';
      if(state.sound){ ensureAudio(); beep(); }        // gesture-scoped: also unlocks audio on iOS
      save(); render(); break;
    }

    case 'newex': sheetNewEx(); break;
    case 'saveex': {
      const name = ($('nxName').value || '').trim();
      if(!name){ toast('Name it first'); break; }
      const primary = $('nxPrim').value;
      const secondary = [...$('sheet').querySelectorAll('[data-sec].on')].map(b => b.dataset.sec).filter(m => m !== primary);
      const ex = {id:'c_'+slug(name)+'_'+uid().slice(0,4), name, primary, secondary, equip:$('nxEq').value, custom:true};
      state.customEx.push(ex); save(); closeSheet(); render(); toast('Added ' + name); break;
    }
    case 'delex': {
      state.customEx = state.customEx.filter(e => e.id !== el.dataset.id); save(); render(); break;
    }

    case 'export': {
      const json = JSON.stringify(state, null, 2);
      const name = 'setclock-' + dayKey(Date.now()) + '.json';
      /* A plain anchor download is blocked inside a sandboxed frame, which is
         exactly where the backup matters most. Use the host save when the page
         has it, and fall back to the anchor everywhere else. */
      const anchorSave = () => {
        const url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
        const a2 = document.createElement('a');
        a2.href = url; a2.download = name;
        document.body.appendChild(a2); a2.click(); a2.remove();
        setTimeout(() => URL.revokeObjectURL(url), 500);
      };
      const host = window.claude && window.claude.downloads;
      if(host && typeof host.save === 'function'){
        host.save({filename:name, data:json})
          .then(() => toast('Backup saved'))
          .catch(err => {
            const code = err && err.code;
            if(code === 'declined') return;                       // never auto-retry
            if(code === 'rate_limited'){ toast('Try that again in a moment'); return; }
            anchorSave();                                          // unavailable etc.
          });
      } else anchorSave();
      break;
    }
    case 'import': {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = () => {
        const f = inp.files[0]; if(!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          try{
            const s = JSON.parse(rd.result);
            if(!s.sets) throw new Error('not a SetClock file');
            if(!confirm('Replace current data with ' + s.sets.length + ' sets from this file?')) return;
            state = Object.assign(state, s);
            state.targets = Object.assign({...DEFAULT_TARGETS}, s.targets || {});
            save(); render(); toast('Imported');
          }catch(e){ alert('Could not read that file: ' + e.message); }
        };
        rd.readAsText(f);
      };
      inp.click(); break;
    }
    case 'wipe': {
      if(!confirm('Erase all gyms, targets and ' + state.sets.length + ' logged sets? This cannot be undone.')) break;
      localStorage.removeItem(KEY); location.reload(); break;
    }
  }
});

/* keep the recovery clock honest when the tab is resumed hours later */
document.addEventListener('visibilitychange', () => { if(!document.hidden && tab === 'today') render(); });
setInterval(() => { if(tab === 'today' && !document.hidden) render(); }, 5*60*1000);

checkStorage(); load(); render();
if(storageOK === false) console.warn('SetClock: storage unavailable —', saveErr);
</script>
